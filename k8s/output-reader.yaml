# Optional helper to inspect PVC xrd-data (papers/ + results/).
# Not required for k8s/run.sh, which stages/fetches via a short-lived pod.
apiVersion: v1
kind: Pod
metadata:
  name: xrd-output-reader
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: alpine:3.20
      command: ["sleep", "3600"]
      volumeMounts:
        - name: xrd-data
          mountPath: /data
  volumes:
    - name: xrd-data
      persistentVolumeClaim:
        claimName: xrd-data
