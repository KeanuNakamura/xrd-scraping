# XRD pipeline Job — same I/O contract as compose.yaml:
#   host papers/  → /app/papers  (read-only)
#   host results/ → /app/results
#
# Do not apply this file directly. Use k8s/run.sh so the HOST_PAPERS /
# HOST_RESULTS placeholders below become absolute paths on your machine.
apiVersion: batch/v1
kind: Job
metadata:
  name: xrd-process
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: xrd
          image: keanu375/xrd-pipeline:v3
          imagePullPolicy: IfNotPresent
          command:
            - python
            - scripts/scrape_and_digitize.py
            - papers/
            - results/
            - --grobid-url
            - http://grobid:8070
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xrd-openai
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2"
          volumeMounts:
            - name: papers
              mountPath: /app/papers
              readOnly: true
            - name: results
              mountPath: /app/results
      volumes:
        - name: papers
          hostPath:
            path: ${HOST_PAPERS}
            type: Directory
        - name: results
          hostPath:
            path: ${HOST_RESULTS}
            type: DirectoryOrCreate
