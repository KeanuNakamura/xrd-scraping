# Cluster workspace for papers/ + results/. Docker Desktop Kubernetes cannot
# reliably hostPath-mount macOS /Users (iCloud Desktop / virtiofs stubs), so
# k8s/run.sh stages host PDFs into this PVC and copies results back out.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xrd-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
